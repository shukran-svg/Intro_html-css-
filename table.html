<!DOCTYPE html>
<html lang="en">

<head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Tables</title>
         <link rel="preconnect" href="https://fonts.googleapis.com">
         <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
         <link href="https://fonts.googleapis.com/css2?family=Fruktur:ital@0;1&family=Mouse+Memoirs&family=Passero+One&family=Spicy+Rice&display=swap"
                  rel="stylesheet">

         <style>
                  body {
                           background-color: #6289bd;
                           font-family: "Mouse Memoirs", sans-serif;
                  }

                  table {
                           border: 2px solid #f1f1f8;

                           border-collapse: collapse;
                           width: 60%;
                           margin: auto;

                  }

                  th {
                           border: 2px solid #0bc0ee;
                           padding-top: 10px;
                           padding-left: 8px;
                           padding-bottom: 10px;
                           text-align: center;
                           background-color: #faf5f5;
                           color: #f80505;
                           font-size: 2.2rem;


                  }


                  td {
                           border: 2px solid #e8edee;
                           text-align: center;
                           padding: 10px;

                  }

                  .sob-column {
                           background-color: #f77104;
                  }

                  .text-danger {
                           color: #f80505;
                  }

                  .text-success {
                           color: #0bee3c;
                  }

                  .fancy-border {
                           border: 2px solid #f1f1f8;

                  }
         </style>
</head>

<body>
         <!-- tr table row -->
         <!-- td table data -->
         <!-- table -->

         <table>
                  <thead>
                           <tr>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Age</th>
                                    <th>Gender</th>
                                    <th>Country</th>
                           </tr>
                  </thead>
                  <tbody>
                           <tr>
                                    <td class="sob-column">John</td>
                                    <td>Doe</td>
                                    <td class="sob-column">30</td>
                                    <td class="fancy-border text-danger">Male</td>
                                    <td class="sob-column">USA</td>
                           </tr>
                           <tr>
                                    <td>Jane</td>
                                    <td>Smith</td>
                                    <td class="sob-column">25</td>
                                    <td class="fancy-border text-success">Female</td>
                                    <td>Canada</td>
                           </tr>
                           <tr>
                                    <td>Michael</td>
                                    <td>Johnson</td>
                                    <td class="sob-column">35</td>
                                    <td>Male</td>
                                    <td>UK</td>
                           </tr>
                           <tr>
                                    <td>Emily</td>
                                    <td>Brown</td>
                                    <td class="sob-column">28</td>
                                    <td class="fancy-border text-danger">Female</td>
                                    <td>Australia</td>
                           </tr>
                           <tr>
                                    <td>David</td>
                                    <td>Wilson</td>
                                    <td class="sob-column">40</td>
                                    <td class="fancy-border text-success">Male</td>
                                    <td class="sob-column">Germany</td>
                           </tr>

                  </tbody>
         </table>

</body>

</html>
