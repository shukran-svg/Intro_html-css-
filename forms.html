<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>FORMS</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Fruktur:ital@0;1&family=Mouse+Memoirs&family=Passero+One&family=Spicy+Rice&display=swap"
          rel="stylesheet">
     <style>
          body {
               font-family: 'Mouse Memoirs', cursive;
               background-color: #f0f0f0;
               padding: 20px;
          }

          form {
               background-color: #f8f2f2;
               padding: 20px;
               border-radius: 5px;
               box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
               max-width: 400px;
               margin: auto;
          }

          label {
               display: block;
               margin-bottom: 5px;
               font-weight: bold;
          }

          input[type="text"],
          input[type="email"],
          input[type="password"],
          input[type="number"],
          input[type="date"],
          select {
               width: 100%;
               padding: 8px;
               margin-bottom: 15px;
               border: 1px solid #ccc;
               border-radius: 4px;
          }

          button {
               background-color: #4CAF50;
               color: white;
               padding: 10px 20px;
               border: none;
               border-radius: 4px;
               cursor: pointer;
          }

          button:hover {
               background-color: #45a049;
          }
     </style>
</head>

<body>

     <!-- input text,email,password,weight,height,date of birth,number,gender
          ,checkbox,radiobutton,select,submit -->

     <form>
          <label for="names">Names</label>
          <input type="text" required id="names" name="full_name" placeholder="John Doe"><br>


          <label for="email">Email</label>
          <input type="email" required id="email" name="email" placeholder="john.doe@example.com" required><br>

          <label for="password">Password</label>
          <input type="password" required id="password" name="password" placeholder="********" required>
          <br>

          <label for="weight">Weight</label>
          <input type="number" min="30" max="300" step="0.01" required id="weight" name="weight" placeholder="70kg">
          <br>

          <label for="dob">Date of Birth</label>
          <input type="date" min="1900-01-01" max="2023-12-31" required id="dob" name="dob">
          <br>
          <!-- name must be te same for radio buttons -->

          <input type="radio" id="m" name="gender">
          <label for="f">Male</label><br>

          <input type="radio" id="f" name="gender">
          <label for="m">Female</label>
          <hr>
          <!-- hr  =horizontal rule used to draw line -->
          <!-- br used to insert a line break -->
          <!-- checkbox allows you to check multiple things or even none -->

          <input type="checkbox" id="x" name="food">
          <label for="x">pizza</label><br>

          <input type="checkbox" id="y" name="food">
          <label for="y">burger</label><br>

          <input type="checkbox" id="z" name="food">
          <label for="z">fries</label><br>

          <select>
               <option value="1">Kenya</option>
               <option value="2">Uganda</option>
               <option value="3">Tanzania</option>
               <option value="4">Rwanda</option>
               <option value="5">Burundi</option>
          </select>

          <button>register</button>

     </form>
</body>

</html>
